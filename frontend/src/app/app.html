<header class="site-header">
  <a routerLink="/" class="brand">🎬 Reel Scout</a>

  <nav class="header-nav">
    @if (auth.user(); as user) {
      <a routerLink="/favorites" routerLinkActive="active-link">
        ♥ Favorites
        @if (favorites.count()) {
          <span class="badge">{{ favorites.count() }}</span>
        }
      </a>
      <span class="greeting">Hi, {{ user.name }}</span>
      <button type="button" class="link-button" (click)="logout()">Log out</button>
    } @else {
      <a routerLink="/login">Log in</a>
      <a routerLink="/register" class="nav-cta">Sign up</a>
    }
  </nav>
</header>

<main class="container">
  <router-outlet />
</main>

<footer class="site-footer">
  <a href="https://www.themoviedb.org" target="_blank" rel="noopener">
    <span class="tmdb-badge">TMDB</span>
  </a>
  <p>This product uses the TMDB API but is not endorsed or certified by TMDB.</p>
</footer>
