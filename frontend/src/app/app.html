<a class="skip-link" href="#main-content">Skip to content</a>

<header class="site-header">
  <a routerLink="/" class="brand">Reel<span>Scout</span></a>

  <nav class="main-nav" aria-label="Main">
    <a routerLink="/" routerLinkActive="active-link" [routerLinkActiveOptions]="{ exact: true }">Home</a>
    <a routerLink="/browse" routerLinkActive="active-link">Browse</a>
    @if (auth.isLoggedIn()) {
      <a routerLink="/favorites" routerLinkActive="active-link">
        My list
        @if (favorites.count()) {
          <span class="badge" [attr.aria-label]="favorites.count() + ' movies'">{{ favorites.count() }}</span>
        }
      </a>
    }
  </nav>

  <div class="header-nav">
    @if (auth.user(); as user) {
      <span class="greeting">Hi, {{ user.name }}</span>
      <button type="button" class="link-button" (click)="logout()">Log out</button>
    } @else {
      <a routerLink="/login">Log in</a>
      <a routerLink="/register" class="nav-cta">Sign up</a>
    }
  </div>
</header>

<main class="container" id="main-content" tabindex="-1">
  <router-outlet />
</main>

<footer class="site-footer">
  <a href="https://www.themoviedb.org" target="_blank" rel="noopener">
    <span class="tmdb-badge">TMDB</span>
  </a>
  <p>This product uses the TMDB API but is not endorsed or certified by TMDB.</p>
</footer>
