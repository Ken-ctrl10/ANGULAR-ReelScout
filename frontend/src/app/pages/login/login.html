<section class="auth-card">
  <h1>Log in</h1>
  <p class="muted">Log in to save your favorite movies.</p>

  @if (error()) {
    <p class="form-error" role="alert">{{ error() }}</p>
  }

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <label for="email">Email</label>
    <input id="email" type="email" formControlName="email" autocomplete="email" />
    @if (showError('email')) {
      <small class="field-error">Enter a valid email.</small>
    } @else if (serverErrors()['email']) {
      <small class="field-error">{{ serverErrors()['email'] }}</small>
    }

    <label for="password">Password</label>
    <input id="password" type="password" formControlName="password" autocomplete="current-password" />
    @if (showError('password')) {
      <small class="field-error">Password is required.</small>
    }

    <button type="submit" class="primary" [disabled]="submitting()">
      {{ submitting() ? 'Logging in...' : 'Log in' }}
    </button>
  </form>

  <p class="muted switch">No account yet? <a routerLink="/register">Create one</a></p>
</section>
